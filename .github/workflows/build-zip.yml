name: Build Foundry ZIP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP with Windows PowerShell
        shell: powershell
        run: .\build_release.ps1

      - name: Run maintained regression suites including ranged increments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'attack-events','attack-outcomes','attack-save-outcomes-integration',
            'bootstrap','combat-cleanup','damage-events','discovery','distraction',
            'duration','effect-groups-silent','migration','native-save-bridge',
            'native-save-context','native-save-outcome-dispatch',
            'native-save-post-chatmessage','neutrality','rest-hooks','rest-daily',
            'save-outcomes','template-save-outcomes','timed-save-outcomes',
            'turn-phases','trusted-table','range-automation','i18n','reload-core',
            'attack-resolution','attack-resolution-integration','item-default-action','chat-actions','chat-action-bootstrap','bleed','bleed-manual','bleed-display','ranged-melee','script-approval-menu','tactical-positioning',
            'defense-modifiers','defense-expiry-events','proximity-auras','passive-save-auras','directional-cover','cover-detection','cover-saves',
            'cover-3d-diagnostics','cover-pf1-rules','native-cover-provenance','movement-status-sync','underwater-melee','weapon-properties-ui',
            'native-cover-attack-integration','cover-mode','cover-native-bridge'
          )
          foreach ($name in $tests) {
            $file = Join-Path tests "$name.test.cjs"
            & node $file
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $file" }
          }

      - name: Validate Foundry package
        shell: powershell
        run: |
          $zips = @(Get-ChildItem -Path .\dist -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one ZIP, found $($zips.Count)." }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            $manifestEntry = $archive.GetEntry('module.json')
            if ($null -eq $manifestEntry) { throw 'module.json is not at ZIP root.' }
            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try { $packagedManifest = $reader.ReadToEnd() | ConvertFrom-Json }
            finally { $reader.Dispose() }
            if ($packagedManifest.socket -ne $true) { throw 'Foundry module socket declaration missing or false in ZIP.' }
            if ($null -eq $archive.GetEntry('scripts/weapon-properties-ui.js')) { throw 'Missing improvised weapon UI service.' }
            if ($null -eq $archive.GetEntry('scripts/effect-groups.js')) { throw 'Missing multi-target effect service.' }
            if ($null -eq $archive.GetEntry('scripts/duration-manager.js')) { throw 'Missing world-time duration manager.' }
            if ($null -eq $archive.GetEntry('scripts/rest-automation.js')) { throw 'Missing native PF1 rest bridge.' }
            if ($null -eq $archive.GetEntry('scripts/rest-daily.js')) { throw 'Missing native PF1 daily-rest Script Call discovery.' }
            if ($null -eq $archive.GetEntry('scripts/save-overrides.js')) { throw 'Missing saving throw override service.' }
            if ($null -eq $archive.GetEntry('scripts/save-context.js')) { throw 'Missing native PF1 save context bridge.' }
            if ($null -eq $archive.GetEntry('scripts/range-automation.js')) { throw 'Missing native PF1 range increment bridge.' }
            if ($null -eq $archive.GetEntry('scripts/ranged-melee.js')) { throw 'Missing native PF1 shooting into melee engine.' }
            if ($null -eq $archive.GetEntry('scripts/tactical-positioning.js')) { throw 'Missing tactical positioning detection.' }
            if ($null -eq $archive.GetEntry('scripts/defense-modifiers.js')) { throw 'Missing conditional defense registry.' }
            if ($null -eq $archive.GetEntry('scripts/directional-cover.js')) { throw 'Missing directional cover service.' }
            if ($null -eq $archive.GetEntry('scripts/cover-detection.js')) { throw 'Missing cover detection service.' }
            if ($null -eq $archive.GetEntry('scripts/cover-3d-diagnostics.js')) { throw 'Missing read-only Cover 3D adapter.' }
            if ($null -eq $archive.GetEntry('scripts/cover-pf1-rules.js')) { throw 'Missing PF1 cover interpretation engine.' }
            if ($null -eq $archive.GetEntry('scripts/native-cover-provenance.js')) { throw 'Missing native PF1 AC provenance adapter.' }
            if ($null -eq $archive.GetEntry('scripts/cover-mode.js')) { throw 'Missing 2D/3D cover mode service.' }
            if ($null -eq $archive.GetEntry('scripts/cover-native-bridge.js')) { throw 'Missing native cover card/total-cover bridge.' }
            if ($null -eq $archive.GetEntry('scripts/cover-saves.js')) { throw 'Missing native Reflex cover service.' }
            if ($null -eq $archive.GetEntry('templates/script-approvals.hbs')) { throw 'Missing Script Approvals form template.' }
            if ($null -eq $archive.GetEntry('lang/en.json')) { throw 'Missing English locale pack.' }
            if ($null -eq $archive.GetEntry('lang/fr.json')) { throw 'Missing French locale pack.' }
            if ($null -eq $archive.GetEntry('scripts/item-default-action.js')) { throw 'Missing native default action service.' }
            if ($null -eq $archive.GetEntry('scripts/chat-actions.js')) { throw 'Missing persistent Chat Actions service.' }
            if ($null -eq $archive.GetEntry('scripts/chat-action-bootstrap.js')) { throw 'Missing elected-GM Chat Actions bootstrap registrar.' }
            if ($null -eq $archive.GetEntry('scripts/bleed.js')) { throw 'Missing generic HP Bleed engine.' }
            if ($null -eq $archive.GetEntry('scripts/bleed-manual.js')) { throw 'Missing manual Bleed condition dialog.' }
            if ($null -eq $archive.GetEntry('scripts/bleed-display.js')) { throw 'Missing Bleed token icon renderer.' }
            if ($null -eq $archive.GetEntry('scripts/reload-adapter.js')) { throw 'Missing reload compatibility adapter.' }
            if ($null -ne $archive.GetEntry('scripts/reload-core.js')) { throw 'Retired reload engine must not be packaged.' }
            if ($null -eq $archive.GetEntry('API-EXPIRATIONS.md')) { throw 'Missing turn expiry documentation.' }
            if ($null -ne $archive.GetEntry('scripts/combat-hooks.js')) { throw 'Removed class-specific combat hook still packaged.' }
            if ($null -ne $archive.GetEntry('macros/enregistrer-cold-adaptation.js')) { throw 'Removed class-specific example macro still packaged.' }
            if (@($archive.Entries | Where-Object { $_.FullName -match '^(\.git|tests|tools)/' }).Count -gt 0) {
              throw 'Development files leaked into release ZIP.'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pf1-automation-engine-foundry-zip
          path: dist/*.zip
          if-no-files-found: error
