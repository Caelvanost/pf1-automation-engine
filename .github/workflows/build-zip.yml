name: Build Foundry ZIP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP with Windows PowerShell
        shell: powershell
        run: .\build_release.ps1

      - name: Run maintained regression suites including ranged increments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'attack-events','attack-outcomes','attack-save-outcomes-integration',
            'bootstrap','combat-cleanup','damage-events','discovery','distraction',
            'duration','effect-groups-silent','migration','native-save-bridge',
            'native-save-context','native-save-outcome-dispatch',
            'native-save-post-chatmessage','neutrality','rest-hooks',
            'save-outcomes','template-save-outcomes','timed-save-outcomes',
            'turn-phases','trusted-table','range-automation','i18n','reload-core'
          )
          foreach ($name in $tests) {
            $file = Join-Path tests "$name.test.cjs"
            & node $file
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $file" }
          }

      - name: Validate Foundry package
        shell: powershell
        run: |
          $zips = @(Get-ChildItem -Path .\dist -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one ZIP, found $($zips.Count)." }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            if ($null -eq $archive.GetEntry('module.json')) { throw 'module.json is not at ZIP root.' }
            if ($null -eq $archive.GetEntry('scripts/effect-groups.js')) { throw 'Missing multi-target effect service.' }
            if ($null -eq $archive.GetEntry('scripts/duration-manager.js')) { throw 'Missing world-time duration manager.' }
            if ($null -eq $archive.GetEntry('scripts/rest-automation.js')) { throw 'Missing native PF1 rest bridge.' }
            if ($null -eq $archive.GetEntry('scripts/save-overrides.js')) { throw 'Missing saving throw override service.' }
            if ($null -eq $archive.GetEntry('scripts/save-context.js')) { throw 'Missing native PF1 save context bridge.' }
            if ($null -eq $archive.GetEntry('scripts/range-automation.js')) { throw 'Missing native PF1 range increment bridge.' }
            if ($null -eq $archive.GetEntry('lang/en.json')) { throw 'Missing English locale pack.' }
            if ($null -eq $archive.GetEntry('lang/fr.json')) { throw 'Missing French locale pack.' }
            if ($null -eq $archive.GetEntry('scripts/reload-adapter.js')) { throw 'Missing reload compatibility adapter.' }
            if ($null -ne $archive.GetEntry('scripts/reload-core.js')) { throw 'Retired reload engine must not be packaged.' }
            if ($null -eq $archive.GetEntry('API-EXPIRATIONS.md')) { throw 'Missing turn expiry documentation.' }
            if ($null -ne $archive.GetEntry('scripts/combat-hooks.js')) { throw 'Removed class-specific combat hook still packaged.' }
            if ($null -ne $archive.GetEntry('macros/enregistrer-cold-adaptation.js')) { throw 'Removed class-specific example macro still packaged.' }
            if (@($archive.Entries | Where-Object { $_.FullName -match '^(\.git|tests|tools)/' }).Count -gt 0) {
              throw 'Development files leaked into release ZIP.'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pf1-automation-engine-foundry-zip
          path: dist/*.zip
          if-no-files-found: error
